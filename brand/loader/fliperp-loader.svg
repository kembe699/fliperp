<svg xmlns="http://www.w3.org/2000/svg" viewBox="-14 -14 128 128" width="128" height="128" role="img" aria-label="Loading">
<style>
.t{animation:pulse 1.6s ease-in-out infinite;transform-origin:50px 50px}
.s,.a,.b,.f{transform-box:fill-box}
.s{transform-origin:50% 100%;animation:sy 1.6s cubic-bezier(.2,.8,.2,1) infinite}
.a{transform-origin:0% 50%;animation:ax 1.6s cubic-bezier(.2,.8,.2,1) infinite}
.b{transform-origin:0% 50%;animation:bx 1.6s cubic-bezier(.2,.8,.2,1) infinite}
.f{transform-origin:100% 0%;animation:fl 1.6s cubic-bezier(.3,1.4,.5,1) infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
@keyframes sy{0%{transform:scaleY(0);opacity:1}18%{transform:scaleY(1)}80%{transform:scaleY(1);opacity:1}92%,100%{transform:scaleY(1);opacity:0}}
@keyframes ax{0%,12%{transform:scaleX(0);opacity:1}32%{transform:scaleX(1)}80%{transform:scaleX(1);opacity:1}92%,100%{transform:scaleX(1);opacity:0}}
@keyframes bx{0%,24%{transform:scaleX(0);opacity:1}44%{transform:scaleX(1)}80%{transform:scaleX(1);opacity:1}92%,100%{transform:scaleX(1);opacity:0}}
@keyframes fl{0%,40%{transform:scale(0)}58%{transform:scale(1)}82%{transform:scale(1)}94%,100%{transform:scale(0)}}
</style>
<g class="t">
<path d="M22 0 H72 L100 28 V78 Q100 100 78 100 H22 Q0 100 0 78 V22 Q0 0 22 0 Z" fill="#1F6FDC"/>
<g class="f"><path d="M72 0 L72 22 Q72 28 78 28 L100 28 Z" fill="#33C2F0"/><path d="M72 28 L100 28 L100 34 Z" fill="#0F4BA8" opacity=".35"/></g>
<rect class="s" x="25" y="23" width="15" height="56" rx="3" fill="#FFFFFF"/>
<rect class="a" x="25" y="23" width="42" height="15" rx="3" fill="#FFFFFF"/>
<rect class="b" x="25" y="46" width="30" height="14" rx="3" fill="#FFFFFF"/>
</g>
</svg>
