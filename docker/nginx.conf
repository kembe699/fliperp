# React app at /, Laravel for /api, /up, /broadcasting and /storage.
server {
    listen 8080 default_server;
    server_name _;
    client_max_body_size 25m;
    server_tokens off;

    root /var/www/frontend;
    index index.html;

    # Laravel entry points
    location ^~ /api/          { try_files /__nonexistent__ @laravel; }
    location = /up             { try_files /__nonexistent__ @laravel; }
    location ^~ /broadcasting/ { try_files /__nonexistent__ @laravel; }

    # Public files (storage:link → storage/app/public)
    location ^~ /storage/ {
        alias /var/www/html/public/storage/;
        try_files $uri =404;
        access_log off;
    }

    location @laravel {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_read_timeout 120s;
    }

    # Hashed build assets can be cached for a long time
    location ^~ /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single-page app
    location / {
        try_files $uri $uri/ /index.html;
    }
}
