<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- FlipERP brand (brand/favicon). ?v=2 makes browsers drop the old icon after a refresh. -->
    <link rel="icon" href="/brand/favicon/favicon.ico?v=2" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/brand/favicon/favicon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon/favicon-32x32.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/favicon/favicon-16x16.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/favicon/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="/brand/favicon/site.webmanifest?v=2" />
    <meta name="theme-color" content="#1F6FDC" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlipERP</title>
    <style>
      /* Splash while the app's code loads; React replaces #root's content when it starts. */
      /* Shown for at least 5 s on every full page load, then faded out by src/main.tsx. */
      .flip-splash { position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; background: #ffffff; transition: opacity 0.35s ease; }
      .flip-splash.is-hidden { opacity: 0; pointer-events: none; }
      .flip-splash img { width: 96px; height: 96px; }
      .flip-splash .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    </style>
  </head>
  <body>
    <div id="flip-splash" class="flip-splash" role="status" aria-live="polite">
      <picture>
        <source srcset="/brand/icon/fliperp-icon.svg" media="(prefers-reduced-motion: reduce)" />
        <img src="/brand/loader/fliperp-loader.svg" alt="" aria-hidden="true" />
      </picture>
      <span class="sr-only">Loading FlipERP…</span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
